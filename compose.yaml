services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visionguard
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - visionguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      VISIONGUARD_DATABASE_URL: postgresql+psycopg://visionguard:${POSTGRES_PASSWORD}@database:5432/visionguard
      VISIONGUARD_CHECKPOINT: /app/artifacts/Patchcore/MVTecAD2/sheet_metal/v1/weights/lightning/model.ckpt
      VISIONGUARD_API_KEY: ${VISIONGUARD_API_KEY:?set VISIONGUARD_API_KEY}
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./outputs:/app/outputs
    depends_on:
      database:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports: ["3000:3000"]
    environment:
      VISIONGUARD_API_URL: http://api:8000
      VISIONGUARD_API_KEY: ${VISIONGUARD_API_KEY:?set VISIONGUARD_API_KEY}
    depends_on: [api]

volumes:
  visionguard-db:
